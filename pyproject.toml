[project]
name = "sentinel-security-intelligence"
version = "0.1.0"
description = "Security telemetry correlation and threat intelligence engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "confluent-kafka>=2.6,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "scikit-learn>=1.5,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
sentinel-ml-evaluate = "sentinel_ml.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api/src", "services/detection/src", "services/graph/src", "services/ingestion/src", "services/ml/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["services/api/src", "services/detection/src", "services/graph/src", "services/ingestion/src", "services/ml/src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/api/src", "services/detection/src", "services/graph/src", "services/ingestion/src", "services/ml/src"]
